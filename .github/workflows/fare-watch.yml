name: fare watch

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC; "17 6 * * 1" = Mondays only (fits the free plan)
  workflow_dispatch:

permissions:
  contents: write # commits data/history.csv and data/state.json
  issues: write # opens an issue when there is an alert

concurrency: fare-watch

jobs:
  scan:
    if: github.repository != 'mtnrabi/fare-watcher' # the original does not scan, your copy does
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan
        id: scan
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python fare_watch.py

      - name: Open an issue for a new alert
        if: steps.scan.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.scan.outputs.title }}
        run: gh issue create --title "$TITLE" --body-file alert.md

      - name: Save the history
        run: |
          git config user.name "fare-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "fares $(date -u +%F)" && git push; }
